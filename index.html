<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-project</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap");

      #app {
        grid-template-areas:
          "leftPanel"
          "rightPanelHeader"
          "rightPanelBody"
          "rightPanelFooter";
      }

      @container (width >= 1216px) {
        #app {
          grid-template-areas:
            "leftPanel rightPanelHeader"
            "leftPanel rightPanelBody"
            "leftPanel rightPanelFooter";
          grid-template-columns: 5fr 7fr;
          grid-template-rows: auto 1fr auto;
          padding-inline: clamp(5rem, 8vw, 10rem);
        }
      }
    </style>
  </head>
  <body
    class="bg-light-body dark:bg-dark-body h-screen font-display @container"
  >
    <div
      id="app"
      class="h-screen grid gap-2 max-w-[1440px] m-auto p-4"
    ></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
