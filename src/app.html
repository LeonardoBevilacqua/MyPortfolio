<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<title>Leonardo A. Bevilacqua | Análista de software</title>
		%sveltekit.head%
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap');

			#app {
				grid-template-areas:
					'leftPanel'
					'rightPanelHeader'
					'rightPanelBody'
					'rightPanelFooter';
			}

			@container (width >= 1216px) {
				#app {
					grid-template-areas:
						'leftPanel rightPanelHeader'
						'leftPanel rightPanelBody'
						'leftPanel rightPanelFooter';
					grid-template-columns: 5fr 7fr;
					grid-template-rows: auto 1fr auto;
					padding-inline: clamp(5rem, 8vw, 10rem);
					height: 100vh;
				}
			}
		</style>
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-light-body dark:bg-dark-body font-display @container desktop:h-screen"
	>
		<div id="app" class="grid gap-2 max-w-[1440px] m-auto p-4">%sveltekit.body%</div>
	</body>
</html>
